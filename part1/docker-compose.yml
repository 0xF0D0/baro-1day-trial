# Optional: a local Postgres for Market Radar, for a machine that has none installed.
#
#   docker compose -f part1/docker-compose.yml up -d
#
# then, in .env:
#
#   DATABASE_URL=postgresql://postgres@localhost:5433/market_radar
#
# The server listens on 127.0.0.1:5433 only, so it does not collide with a Postgres already on 5432, and it accepts
# local connections without a password. The data lives in the volume `market-radar_pgdata`:
# `docker compose -f part1/docker-compose.yml down` keeps it, `down -v` deletes it.
name: market-radar

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=market_radar
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_radar"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
