error_log /dev/stderr crit;
events {}
http {
  access_log off;
  upstream api { server api1:8080; server api2:8080; }
  server {
    listen 8080;
    client_max_body_size 1m;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
