services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  secrets-init:
    image: alpine:3.20
    # Creates each secret once, in the bind mount ./out/secrets (gitignored), and never overwrites one.
    # The files are world-readable so the non-root services and host-side tests can read them.
    command:
      - sh
      - -c
      - |
        set -e
        [ -s /secrets/kek ] || head -c 32 /dev/urandom > /secrets/kek
        [ -s /secrets/minio_user ] || head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/minio_user
        [ -s /secrets/minio_password ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/minio_password
        chmod 644 /secrets/kek /secrets/minio_user /secrets/minio_password
    volumes:
      - ./out/secrets:/secrets

  minio:
    # Docker Hub no longer serves minio/minio; this is the last pinned Bitnami build of the same server.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    user: "0"
    entrypoint:
      - sh
      - -c
      - |
        MINIO_ROOT_USER="$$(cat /secrets/minio_user)" MINIO_ROOT_PASSWORD="$$(cat /secrets/minio_password)" \
          exec /opt/bitnami/minio/bin/minio server /data
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - miniodata:/data
      - ./out/secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  api1:
    build: ./backbone
    environment:
      - BACKBONE_DATABASE_URL=postgres://postgres@postgres:5432/postgres?sslmode=disable
      - BACKBONE_TENANTS_FILE=/config/tenants.json
      - BACKBONE_KEK_FILE=/secrets/kek
      - BACKBONE_MINIO_ENDPOINT=minio:9000
      - BACKBONE_MINIO_USER_FILE=/secrets/minio_user
      - BACKBONE_MINIO_PASSWORD_FILE=/secrets/minio_password
    volumes:
      - ${TENANTS_FILE:?set TENANTS_FILE}:/config/tenants.json:ro
      - ./out/secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  api2:
    build: ./backbone
    environment:
      - BACKBONE_DATABASE_URL=postgres://postgres@postgres:5432/postgres?sslmode=disable
      - BACKBONE_TENANTS_FILE=/config/tenants.json
      - BACKBONE_KEK_FILE=/secrets/kek
      - BACKBONE_MINIO_ENDPOINT=minio:9000
      - BACKBONE_MINIO_USER_FILE=/secrets/minio_user
      - BACKBONE_MINIO_PASSWORD_FILE=/secrets/minio_password
    volumes:
      - ${TENANTS_FILE:?set TENANTS_FILE}:/config/tenants.json:ro
      - ./out/secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
